# See packaging/linux/README.md.
app-id: com.rtsoft.patchy
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: patchy
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Theme and script sounds through paplay (PipeWire serves this socket too).
  - --socket=pulseaudio
  # Update check and Object Selection's High Quality model download (it lands in the
  # app's data folder, which `flatpak uninstall --delete-data` removes).
  - --share=network
  # Recent files, command-line file arguments, brush and palette folders.
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /onnxruntime
modules:
  # Automatic selection (docs/ai-selection.md): the pinned ONNX Runtime CPU package. The
  # headers and link library stay under /onnxruntime for the patchy build (cleaned up
  # afterwards); the shared library goes to /app/lib, where the loader finds it. Keep the
  # version and checksums in sync with scripts/setup-ai-deps.sh.
  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/onnxruntime /app/lib
      - cp -a include lib LICENSE ThirdPartyNotices.txt /app/onnxruntime/
      - cp -a lib/libonnxruntime.so* /app/lib/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
        sha256: a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-aarch64-1.30.0.tgz
        sha256: e16a27a8ed330bbc698df7330b0cf56e722f354e3bcc92118682c74ef3c3e3da
  - name: patchy
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPATCHY_BUILD_TESTS=OFF
      - -DPATCHY_REQUIRE_AI_SELECTION=ON
      - -DPATCHY_GMIC_THREADS=ON
      - -DPATCHY_ONNXRUNTIME_DIR=/app/onnxruntime
      - -DPATCHY_AI_MODELS_DIR=/run/build/patchy/ai-models-pinned
    sources:
      - type: dir
        path: ../../..
        skip:
          - build
          - .deps
          - .git
          - local-secrets
          - local-test-fixtures
          - test-artifacts
      # The int8 automatic selection models, pinned like scripts/setup-ai-deps.sh.
      # Not "ai-models-download": the build clears that folder in the build directory (cmake/patchy_ai.cmake).
      - type: file
        url: https://github.com/SethRobinson/Patchy/releases/download/ai-models-1/mobile_sam_image_encoder_int8.onnx
        sha256: 6af3f249f7a5a6a8a3ef988b6814015e8c3a300977c135d1f9572ed2f2930cd7
        dest: ai-models-pinned
      - type: file
        url: https://github.com/SethRobinson/Patchy/releases/download/ai-models-1/sam_mask_decoder_multi_int8.onnx
        sha256: aa1410bec8f050b6017fba29ca07f16317029a8f74a98e5998aeed46680c10a6
        dest: ai-models-pinned
      # birefnet_lite_general_1024_int8.onnx (Select Subject) is left out while
      # PATCHY_ENABLE_SELECT_SUBJECT is off (held back pending patent review); restore it from
      # scripts/setup-ai-deps.sh together with -DPATCHY_ENABLE_SELECT_SUBJECT=ON.
